[project]
name = "sadhan"
version = "0.1.0a1"
description = "A self-contained AI agent harness: any LiteLLM model drives real bash tool calls in a persistent shell, with a terminal UI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "Gauresh Tambe", email = "gaureshtambe25@gmail.com" }
]
keywords = ["ai", "agent", "llm", "ollama", "cli", "tui", "bash"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
]
dependencies = [
    "litellm",
    "pydantic>=2.13.4",
]

[project.urls]
Homepage = "https://blog.gauresh.art/demystifying-ai-harnesses"
Source = "https://github.com/GaureshArt/sadhan"

[project.scripts]
sadhan = "sadhan.__main__:main"
sadhan-tui = "sadhan.tui:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
